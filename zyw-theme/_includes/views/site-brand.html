<a
  class="site-brand-inner inline-flex items-center h-16 no-underline hover:underline text-inherit transition-colors duration-100"
  rel="author"
  href="{{ "/" | relative_url }}"
>
  <img
    class="site-favicon inline-block h-10 mr-2"
    title="{{ site.title | escape }}"
    src="{{ site.favicon }}"
    onerror="this.style.display='none'"
  >
  <span class="font-semibold -tracking-px">{{ site.title | escape }}</span>
</a>
