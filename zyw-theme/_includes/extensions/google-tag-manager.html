<!-- Google Tag Manager (consent-aware) -->
<script>
  <!--//
  (function () {
    var containerId = '{{ site.gtm_container_id | default: "" }}'.trim();
    if (!containerId) {
      return;
    }

    var gtmLoaded = false;

    function isDoNotTrackEnabled() {
      var doNotTrack =
        window.doNotTrack === '1' ||
        navigator.doNotTrack === '1' ||
        navigator.doNotTrack === 'yes' ||
        navigator.msDoNotTrack === '1';
      var enableDNT = '{{ site.enableDNT | default: true }}' == 'true';
      return enableDNT && doNotTrack;
    }

    window.dataLayer = window.dataLayer || [];
    if (typeof window.gtag !== 'function') {
      window.gtag = function () {
        window.dataLayer.push(arguments);
      };
    }

    window.gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      functionality_storage: 'denied',
      security_storage: 'granted',
      wait_for_update: 500,
    });

    function loadGtmScript() {
      if (gtmLoaded || isDoNotTrackEnabled()) {
        return;
      }

      gtmLoaded = true;
      window.dataLayer.push({
        'gtm.start': new Date().getTime(),
        event: 'gtm.js',
      });

      var firstScript = document.getElementsByTagName('script')[0];
      var scriptTag = document.createElement('script');
      scriptTag.async = true;
      scriptTag.src = 'https://www.googletagmanager.com/gtm.js?id=' + containerId;
      firstScript.parentNode.insertBefore(scriptTag, firstScript);
    }

    function syncGtmWithConsent(state) {
      if (isDoNotTrackEnabled()) {
        return;
      }

      var hasAnalyticsConsent = !!(state && state.analytics);
      var hasFunctionalConsent = !!(state && state.functional);

      window.gtag('consent', 'update', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: hasAnalyticsConsent ? 'granted' : 'denied',
        functionality_storage: hasFunctionalConsent ? 'granted' : 'denied',
        security_storage: 'granted',
      });

      if (hasAnalyticsConsent) {
        loadGtmScript();
      }
    }

    function getCurrentConsentState() {
      if (
        window.ZYWConsentManager &&
        typeof window.ZYWConsentManager.getConsentState === 'function'
      ) {
        return window.ZYWConsentManager.getConsentState();
      }

      return window.__ZYWConsentState || null;
    }

    syncGtmWithConsent(getCurrentConsentState());

    document.addEventListener('zyw:consent-changed', function (event) {
      syncGtmWithConsent(event.detail || null);
    });
  })();
  //-->
</script>
