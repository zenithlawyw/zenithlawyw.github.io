<div class="inline-flex items-center mr-2 md:mr-0" data-theme-toggle>
  <label
    class="inline-flex items-center gap-2 rounded-full bg-black/10 dark:bg-white/10 px-3 py-1.5 text-xs font-semibold text-gray-800 dark:text-gray-100 cursor-pointer select-none transition-colors hover:bg-black/20 dark:hover:bg-white/20 shadow-[0_2px_8px_rgba(0,0,0,0.12)]"
  >
    <input
      type="checkbox"
      class="theme-switch-input sr-only"
      aria-label="Toggle dark mode"
    >
    <svg
      class="theme-icon-light h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.36 6.36-1.41-1.41M7.05 7.05 5.64 5.64m12.72 0-1.41 1.41M7.05 16.95l-1.41 1.41"></path>
      <circle cx="12" cy="12" r="4"></circle>
    </svg>
    <svg
      class="theme-icon-dark hidden h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3c0 .43.05.86.15 1.27a7 7 0 0 0 8.37 8.37c.41.1.84.15 1.27.15z"></path>
    </svg>
    <span class="theme-mode-text">Light</span>
  </label>
</div>

{%- assign name = 'night_mode' -%}
{%- include functions.html func='get_value' default='auto' -%}
{%- assign night_mode = return -%}

<script language="javascript">
  <!--//
    (function() {

      function getToggleElements(root) {

        function saveThemeData(data) {

        function loadThemeData() {

        function syncToggleLabels(isDark) {

        function applyTheme(nightShift) {

        function setTheme(nightShift) {
          themeData.nightShift = !!nightShift;
          saveThemeData(themeData);

        function autoThemeToggle() {

          toggleAt.setMinutes(0);
          toggleAt.setSeconds(0);

          var delay = toggleAt.getTime() - now.getTime();

          // auto toggle theme mode
          setTimeout(function() {
            setTheme(!nightShift);

          return {
            nightShift: nightShift,

          };
        }

        };

        if (nightModeOption == 'auto') {

          if (data.toggleAt > themeData.autoToggleAt) {

            setTheme(data.nightShift);
          } else {

</script>
