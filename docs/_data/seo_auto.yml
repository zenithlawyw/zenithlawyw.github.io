    questions:
      - question: Which open-source vector database should I choose for RAG?
        answer: Choose **FAISS** for ultra-fast performance during local prototyping. Use **Chroma** for lightweight disk persistence with structured metadata filtering. Transition to **Qdrant** for true large-scale multi-node orchestration requiring advanced data storage, payload management, and horizontal scaling. Start with FAISS or Chroma for development; migrate to Qdrant when you need production persistence and filtering.
      - question: What chunk size should I use for RAG document processing?
        answer: Target 256-512 tokens per chunk. Smaller chunks (128 tokens) improve retrieval precision but lose surrounding context. Larger chunks (1024+ tokens) preserve context but reduce retrieval accuracy because irrelevant content dilutes the embedding signal. Use sentence-level splitting with paragraph awareness for the best balance.
      - question: How do I handle documents that update frequently in a RAG system?
        answer: "Implement incremental indexing: detect changed documents, re-chunk and re-embed only the modified portions, and update the vector store. the survey of generative retrieval by Li et al. includes useful patterns for continual learning on dynamic corpora that apply to traditional RAG indexing as well."
      - question: Is cross-encoder re-ranking worth the additional latency?
        answer: Yes. While cross-encoders introduce a minor latency cost (50-200ms depending on hardware), they eliminate high-scoring semantic distractors. Given that distractor contamination can degrade generation accuracy by over 25%, a re-ranking layer is a required safety gate for production RAG, not an optional enhancement.
      - question: Can I use RAG without a GPU?
        answer: Yes, for small-scale deployments. CPU-based embedding models (all-MiniLM-L6-v2) and quantised LLMs (via Ollama or llama.cpp) can run on standard servers. For production throughput, a GPU accelerates both embedding computation and LLM inference. The RAG infrastructure itself (vector store, BM25 index, re-ranker) can run on CPU.
      - question: How do I evaluate whether my RAG system is production-ready?
        answer: "Run the separated evaluation pipeline described in Stage 7. Production readiness requires: retrieval precision@5 > 0.7, context recall@20 > 0.9, generation faithfulness > 0.85, and answer relevancy > 0.8. Also verify latency targets (p95 < 2s for most applications) and error rates (< 1% failed queries)."
      - question: Should I fine-tune my LLM in addition to using RAG?
        answer: Do not treat them as mutually exclusive choices. RAG provides an external, volatile memory bank, ideal for real-time, updatable data. Fine-tuning teaches the model domain-specific formatting, structural constraints, and industry vocabulary. For domain-specific deployments where the model needs to adopt specialised citation styles or conventions, add LoRA fine-tuning. Meng et al. show that the combination outperforms either technique alone.
      - question: What is the minimum viable RAG pipeline I can deploy quickly?
        answer: A simple directory reader, sentence splitter (512-token chunks), all-MiniLM-L6-v2 embeddings, FAISS index, Ollama with Llama 3.1 8B, and a basic prompt template. This can be built in under a day with LlamaIndex or LangChain. Add hybrid retrieval and re-ranking as your first optimisation.
      - question: How do I handle multilingual documents in a RAG system?
        answer: Use multilingual embedding models (e.g., `multilingual-e5-large` or `paraphrase-multilingual-MiniLM-L12-v2`). Note that Amugongo et al. found 78.9% of healthcare RAG studies use English-only datasets, so evaluate multilingual retrieval quality carefully before deploying in non-English clinical or critical settings.
      - question: What is the most common failure mode in production RAG?
        answer: "Distractor contamination: retrieving documents that are semantically similar to the query but do not contain the correct answer. This is the most harmful retrieval artefact, worse than completely random documents. Implement cross-encoder re-ranking and monitor retrieval precision to detect and prevent this failure mode."
