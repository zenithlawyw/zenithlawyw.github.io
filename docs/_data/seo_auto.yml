    questions:
      - question: Can IoT devices with limited memory run post-quantum cryptography?
        answer: Kyber-768 needs roughly 2.4 KB for public and private keys combined, which fits on most 32-bit microcontrollers. But "fits" is not the same as "works well." No peer-reviewed benchmark validates PQC on production IoT hardware with real workloads. Devices below 32 KB of available RAM may need hardware-accelerated PQC, lighter constructions, or offloaded key operations.
      - question: Which sector faces the most urgent quantum threat?
        answer: Energy grid infrastructure. The combination of 30-year-plus operational lifetimes, cascading failure potential, and legacy SCADA authentication makes the case almost self-evident. Encrypted SCADA traffic captured today may well be decryptable within the operational lifespan of grid equipment being installed right now. Mosca's inequality is already in the red for this sector.
      - question: Why does every applied PQC paper default to Kyber and Dilithium?
        answer: "Incentive alignment. NIST standardisation brings library support, regulatory compliance, and interoperability expectations. Kyber and Dilithium also happen to perform well on commodity hardware. The downside is systemic: one mathematical family, one failure mode. If lattice assumptions weaken, every sector loses protection simultaneously."
      - question: Are there any production deployments of PQC?
        answer: Not among the papers reviewed here. Broader industry experiments exist (Google's CECPQ2, Cloudflare's post-quantum TLS rollout), but they sit outside the scope of this academic review. The applied research community is still at the conceptual and prototype stage. Production deployment with real adversaries and real operational constraints has not been reported in the peer-reviewed literature.
