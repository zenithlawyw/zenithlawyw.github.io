    questions:
      - question: "Hybrid QC/PQC: Defence in Depth, or Wishful Layering?"
        answer: 'Kavitha et al. propose combining quantum key distribution (QKD) with PQC encryption as a defence-in-depth strategy. The logic is appealing: QKD provides information-theoretic security grounded in physics, while PQC provides computational security on classical infrastructure. An attacker who needs to break _both_ faces a higher bar than either defence alone. Kavitha et al. propose combining quantum key distribution (QKD) with PQC encryption as a defence-in-depth strategy. The logic is appealing: QKD provides information-theoretic security grounded in physics, while PQC provides computational security on classical infrastructure. An attacker who needs to break _both_ faces a higher bar than either defence alone. A caveat is warranted here. The Kavitha et al. proposal is conceptual. No prototype was built, no simulation was run, no performance data was collected. The architecture is plausible but entirely unvalidated, and no formal security model exists to prove that the combination actually provides strictly greater security than either component in isolation. The argument that "two layers must be better than one" sounds intuitive, but intuition is not proof.'
      - question: Where Hybrid Might Make Sense?
        answer: 'Despite the thin evidence base, the use cases with the strongest rationale are narrow and specific: - **Government and military communications** where "harvest now, decrypt later" threats are existential and budgets can absorb quantum hardware costs - **Financial infrastructure** where transaction integrity carries multi-decade legal significance'
      - question: What makes post-quantum cryptography different from quantum cryptography?
        answer: They solve different problems with different tools. Post-quantum cryptography uses classical algorithms, running on ordinary hardware, designed to resist attacks from quantum computers. Quantum cryptography (typically QKD) uses the physical properties of photons to distribute keys, which requires specialised quantum hardware and fibre-optic channels. PQC is about upgrading the maths; QKD is about changing the physics. Most organisations will deploy PQC. Very few will deploy QKD.
      - question: Why were SIKE and Rainbow broken, and what does that tell us?
        answer: SIKE fell to a classical mathematical attack that exploited torsion-point information in the SIDH protocol, building on a theorem published by Kani in 1997. Rainbow was broken by Beullens' key-recovery attack, also entirely classical. Both had survived multiple rounds of NIST evaluation. The lesson is not that NIST's process failed; it is that PQC algorithms sit on mathematical foundations that have received far less adversarial attention than RSA or ECC. Expect more surprises. Design for algorithm replacement.
      - question: Is AES-256 safe against quantum computers?
        answer: For all practical purposes, yes. Grover's algorithm halves the effective key length in the idealised brute-force model, reducing AES-256 to roughly 128-bit equivalent security against a quantum adversary. That level of resistance remains computationally infeasible with any foreseeable resources. The real cost of running Grover on actual quantum hardware (circuit depth, error correction, parallelisation limits) may push the effective security even higher. The genuine vulnerability in most systems is asymmetric cryptography, not AES.
      - question: How does hardware acceleration change PQC deployment decisions?
        answer: Code-based PQC schemes like HQC and BIKE depend on sparse polynomial multiplication that is expensive in software. The FPGA accelerators from He et al. reduce the area-delay product by 57 to 80%, which makes these schemes viable candidates for embedded and IoT contexts where software-only performance would be prohibitive. Without that kind of hardware support, the practical PQC palette shrinks to lattice-based schemes almost by default.
