    questions:
      - question: How are explanation methods categorised in the XAI literature?
        answer: The dominant taxonomy, proposed by Li et al. (2022), is three-dimensional rather than a single list of categories. It organises interpretation algorithms by the representation of the interpretation (feature importance, model response, model rationale process, dataset), the type of model addressed (model-agnostic, differentiable, specific model), and the relation between the algorithm and the model (closed-form, composition, dependence, proxy). Each algorithm is characterised by its position on all three dimensions.
      - question: What distinguishes backpropagation-based methods from perturbation-based methods?
        answer: Backpropagation-based methods compute attributions through a single forward-backward pass and are computationally efficient but sensitive to gradient properties such as saturation and shattering. Perturbation-based methods observe output changes when inputs are modified and are more robust but require many forward passes, creating a computational cost that scales with the number of features.
      - question: Why does Samek et al. argue for axiomatic foundations in XAI evaluation?
        answer: Samek et al. argue that grounding explanation methods in axioms such as sensitivity, implementation invariance, and the Shapley properties provides a principled basis for comparing methods and reasoning about their behaviour that purely empirical evaluation on a single metric would miss. Axioms help detect failures and clarify what a method can and cannot be trusted to reveal, though no single axiom system fully characterises an explanation.
      - question: How can explanation methods serve as model validation tools?
        answer: Lapuschkin et al. (2019) demonstrate that explanation methods can detect Clever Hans behaviour where models exploit spurious correlations invisible to accuracy metrics. Their spectral relevance analysis (SpRAy) clusters explanation heatmaps to reveal, for example, that a horse classifier relied on a source tag present in the images and that a Pinball agent cheated by abusing the nudging mechanism, making explanation methods a diagnostic tool rather than just a transparency device.
      - question: What is concept-based XAI and how does it differ from feature attribution?
        answer: 'Concept-based XAI explains model decisions in terms of human-understandable concepts rather than raw features. While feature attribution assigns importance scores to individual input dimensions such as pixels or words, concept-based methods identify whether the model recognises higher-level abstractions such as stripes, colour patterns, or medical indicators. This aligns explanations with how humans naturally reason. <details markdown="1" class="appendix-callout group"> <summary>Appendix: Source Material</summary>'
