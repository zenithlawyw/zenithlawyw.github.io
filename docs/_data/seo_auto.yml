    questions:
      - question: What This Means in Practice?
        answer: "Users of RAG systems tend to trust cited outputs more than uncited ones. This trust is rational but can be exploited by the system's own failure modes. Production systems should: - Never present citations as proof of correctness. Present them as evidence sources that the user can verify. - Implement citation verification checks that compare the generated claim against the retrieved passage, not just confirm that the passage was retrieved."
      - question: What is the most dangerous RAG failure mode?
        answer: "Distractor contamination: retrieving documents that are semantically similar to the query but do not contain the correct answer. Cuconasu et al. show that a single distractor can reduce accuracy by 25%, and this is more harmful than completely random noise because the generator treats high-scoring but misleading documents as authoritative. This evidence comes from NQ-open at small model scales; the effect at larger scales is plausible but untested."
      - question: Does RAG eliminate hallucination?
        answer: "No. RAG reduces certain categories of hallucination by grounding generation in retrieved evidence, but it introduces new failure modes: the system can misrepresent sources, blend contradictory documents into a false synthesis, or generate confidently from thin evidence. Citation presence does not guarantee truthfulness."
      - question: How do I know if my RAG corpus is still reliable?
        answer: Implement automated regression testing with a labelled evaluation set. Run it after every corpus update and compare key metrics (Precision@5, MRR, Faithfulness) against the previous baseline. Also monitor retrieval contradiction rates and document freshness. Rising contradictions or increasing staleness indicate corpus governance problems.
      - question: Should I display confidence scores to users?
        answer: Display confidence signals, not raw scores. Users cannot interpret a re-ranker score of 0.73 vs. 0.41, but they can act on "high confidence, multiple corroborating sources" vs. "limited evidence, please verify independently." The calibration table in this article provides a starting framework.
      - question: What is corpus authority drift?
        answer: The gradual accumulation of lower-quality documents in a RAG knowledge base over time. As new documents are added without authority review, the corpus can shift from authoritative primary sources toward a mixture that includes outdated, contradictory, or user-generated content. This degrades retrieval quality silently because no single addition triggers a measurable failure.
      - question: How often should I red-team test my RAG system?
        answer: Before initial production launch, after significant corpus updates, and on a regular schedule. For high-stakes domains (healthcare, legal, financial), monthly testing is a reasonable starting point. For lower-stakes applications, quarterly testing combined with continuous monitoring may suffice.
      - question: What should I log for RAG audit compliance?
        answer: "The full retrieval chain: query text, retrieved document IDs with scores, which documents survived filtering, the constructed prompt, the raw model output, and any post-processing applied. This enables root-cause analysis and meets the audit trail requirements of regulatory frameworks like HIPAA and GDPR."
      - question: Can general-purpose RAG evaluation metrics catch domain-specific failures?
        answer: No. Amugongo et al. document that general-purpose metrics do not capture clinical safety, language equity, ethical considerations, or regulatory compliance. The same gap applies to legal and financial domains. Domain-specific evaluation criteria must be added on top of general frameworks like RAGAS.
      - question: What is the difference between retrieval failure and generation failure in RAG?
        answer: Retrieval failure means the correct document was not retrieved or was ranked below distractors. Generation failure means the correct document was retrieved and included in the prompt, but the model produced an incorrect or unfaithful response. Huang and Huang emphasise that these are independent failure modes requiring separate metrics and diagnostic pipelines.
      - question: How do I handle queries that fall outside my RAG corpus scope?
        answer: 'Implement scope-boundary detection: when all retrieved documents score below a confidence threshold, return an explicit "this question is outside the system''s knowledge scope" response rather than generating an answer. Systems that generate answers for out-of-scope queries are more dangerous than systems that refuse, because the user has no signal that the response is ungrounded.'
