    questions:
      - question: What domain-specific requirements exist for XAI in medical imaging and clinical settings?
        answer: Medical imaging requires explanation methods that are robust to Clever Hans artifacts, produce spatially coherent attribution maps, and provide uncertainty quantification alongside explanations. Clinical deployment additionally demands explanations that align with medical reasoning workflows, regulatory compliance under frameworks such as the EU AI Act, and validation against established diagnostic standards rather than purely technical metrics.
      - question: How does the EU AI Act affect XAI deployment and governance requirements?
        answer: The EU AI Act classifies AI systems by risk level and imposes transparency obligations that include documentation of training data, model architecture, and intended use. For high-risk systems, it requires human oversight mechanisms and technical documentation of explainability properties. The Act creates legal accountability for explanation quality without prescribing specific technical standards, creating both pressure and flexibility.
      - question: What evaluation frameworks exist for assessing explanation quality in practice?
        answer: "Three main frameworks have emerged: functionally-grounded evaluation using formal proxies such as faithfulness and completeness, human-grounded evaluation through user studies that measure how explanations affect human decision-making, and application-grounded evaluation in real deployment contexts. Surveys such as Dwivedi et al. (2023) support practitioners in selecting and implementing these approaches for their use cases."
      - question: How does Salvi et al. connect explainability and uncertainty in their framework?
        answer: Salvi et al. (2025) argue that explanations without uncertainty quantification are fundamentally incomplete because users cannot distinguish between confident model predictions and those near decision boundaries. Their framework integrates uncertainty estimates into explanation outputs by modifying attribution methods to propagate epistemic and aleatoric uncertainty through the explanation computation.
      - question: What governance structures are needed for responsible XAI deployment?
        answer: 'Effective governance requires organisational accountability mechanisms including designated explainability officers, access governance that matches explanation detail to stakeholder roles, documented decision frameworks for method selection, and regular audit cycles that verify explanations remain faithful after model updates. These structures bridge the gap between technical capability and responsible practice. <details markdown="1" class="appendix-callout group"> <summary>Appendix: Source Material</summary>'
