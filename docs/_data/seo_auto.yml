    questions:
      - question: What Settles on the Ledger, and What Does Not?
        answer: "A recurring error in stablecoin commentary is to treat an on-chain transfer as if it settled the whole transaction. The corpus is explicit that it does not. The BIS working paper quantifies the gap between transaction-level and transfer-level views. Using 593 million event logs from 141 million Ethereum transactions involving three major US dollar stablecoins, the authors classify a transaction as a simple transfer if it contains exactly one stablecoin transfer event and no additional event logs. Under that definition 68.4 percent of transactions are simple transfers. But the transfer-level picture differs sharply: 59.96 percent of all stablecoin transfers occur within complex transactions, which combine trading, lending, arbitrage, liquidity provision, and settlement, rather than as standalone value transfers. Analyses that read each transfer as a standalone payment therefore risk misclassifying almost six in ten transfer events, since those events occur inside complex transactions rather than as standalone value transfers, and such analyses overstate the share of simple person-to-person payments. The operational reading of that finding is direct. Fast, atomic ledger settlement describes only the token leg. Where a stablecoin payment begins or ends in fiat, the institution must also organise the corresponding fiat funding or redemption leg: money entering the system when stablecoins are bought, and money leaving when they are redeemed. Purely on-chain transactions that never touch fiat have no separate fiat leg at the point of transfer, although the surrounding custody and compliance layers still operate on banking timelines. The FCA regime makes this visible. The final rules require issuers to hold backing assets in a statutory trust, generally with a third-party custodian outside the group, to offer redemption at par to all holders, and to place payment orders for redeemed funds by the end of the next business day once the redeemed stablecoin is received and the required checks are complete. The token moves in seconds; the money behind it moves on banking timelines."
