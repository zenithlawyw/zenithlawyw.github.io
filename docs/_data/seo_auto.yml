    questions:
      - question: "Question 1: What model access do you have?"
        answer: "| Access level | Available methods | Limitation | | ------------------------------ | ------------------------------------------------------ | ------------------------------ | | Black-box (API only) | LIME, SHAP (KernelSHAP), GAPS, MOFAE | Cannot use FACE, ExCIR, or C3A |"
      - question: "Question 2: What does your domain require?"
        answer: "| Domain requirement | Preferred approach | Methods to consider | Methods to avoid | | -------------------------- | --------------------------------------------------- | --------------------------------- | ------------------------------ | | Causal explanation | Causal SHAP (if < 30 features), ExCIR for awareness | Causal SHAP, ExCIR | Standard SHAP, LIME |"
      - question: "Question 3: What evaluation standard applies?"
        answer: "- **Research publication**: Use at least two evaluation paradigms. Dehdarirad demonstrates one approach: cross model architectures (classical LR/RF vs. transformer-based DistilBERT/RoBERTa) with dataset characteristics (domain, text length, class balance) and evidence types (positive, negative, all). This triply crossed design reveals that SHAP fails for negative evidence under LR but succeeds under RF. This finding is invisible to single-dimension comparisons. Follow this multi-factorial approach rather than reporting aggregate rankings that mask conditional failures. - **Production deployment**: Supplement automated metrics with human evaluation on a representative sample. Use the decision-path inspection of Moreira et al. for any tree-based model. Monitor attribution drift over time using rank correlation between current and baseline feature importance distributions. Design stakeholder-specific explanation formats. The default outputs of the field (heatmaps, bar charts) do not serve non-technical audiences. Log method choice, implementation variant (e.g., interventional vs. conditional SHAP), and known limitations for each production prediction. - **Regulatory compliance**: The verification impossibility is a live compliance risk under the EU AI Act. High-risk AI systems (Annex III categories such as biometric identification, critical infrastructure, and access to essential services) must provide transparency under Article 13, including meaningful information about the decision logic. Standard black-box attributions cannot meet this standard for individual predictions. Use Model Cards for model-level documentation alongside per-explanation metadata recording which method was used, what it assumes, and what it cannot guarantee. The developing EN ISO/IEC 42001 AI management system standard may provide a structured audit framework, but it is not yet finalised. Document the rationale for method selection against domain stakes. Accept that individual prediction explanations from black-box models cannot be independently verified and communicate this limitation to auditors and regulators."
      - question: Should I use SHAP or LIME as my default?
        answer: The evidence in this series shows both have known failure modes. SHAP conflates correlation with causation (Janzing, Ng). LIME underperforms on time series (Troncoso-García). Use the decision framework above to select based on your specific constraints, and always validate with at least one metric from a different paradigm.
      - question: How should attribution be integrated into an ML pipeline?
        answer: "At three points: (1) feature selection stage (Kost's XAI-FS approach), (2) model validation stage (evaluation against domain expert baselines), (3) production monitoring stage (tracking attribution stability under distribution shift). Production monitoring for attribution drift is analogous to data and concept drift monitoring: track the rank correlation between current and baseline feature importance distributions, and alert when it drops below a threshold. Most current practice only addresses the second stage."
      - question: What should I tell a regulator about my explanations?
        answer: Be honest about what they cannot do. Standard post-hoc explanations from black-box models cannot be verified for individual cases (Bhalla). They are aggregate statistical summaries, not guarantees of model behaviour. If a regulator requires verifiable explanations, you need either an inherently interpretable model or a VerT-adapted model.
      - question: How much should I invest in attribution infrastructure?
        answer: Proportional to the cost of an incorrect explanation. For a product recommendation system, lightweight SHAP or LIME may suffice. For a medical diagnostic aid, invest in stronger methods (FACE or Causal SHAP), multi-paradigm evaluation, and stakeholder-specific explanation formats.
      - question: What is the single most important thing a practitioner should do?
        answer: Triangulate. Do not rely on a single attribution method, a single evaluation metric, or a single validation dataset. The evidence in this series consistently shows that results are conditional on choices that are easy to overlook when using a single method.
