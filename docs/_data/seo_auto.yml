    questions:
      - question: How does Knowledge Space work?
        answer: Select a research focus domain or enter your own keywords, choose your sources, and click Search Literature. Knowledge Space fetches recent papers and preprints in real time from the APIs you selected, filters by your keywords and match mode, and returns paginated results ready to explore.
      - question: Which sources does this tool search?
        answer: "The tool queries two open academic APIs: OpenAlex (a broad scholarly works index covering journals and conference papers) and Crossref (a DOI registration and metadata service). Each brings distinct coverage and indexing depth, so combining them typically yields a fuller picture."
      - question: How are keywords matched against papers?
        answer: Matching runs against each record's title and abstract. "All keywords must match" narrows results to items where every keyword appears; "Any keyword may match" broadens results to items containing at least one keyword. Switching modes is the fastest way to widen a narrow search.
      - question: Is any data stored when I search?
        answer: Fetched literature records are not stored in application-level persistent storage. Limited browser-side session state may be used for security and rate protection during your session. Normal operational logs from hosting, edge, or analytics services may still apply independently under their own policies.
      - question: Will search still work if I reject analytics cookies?
        answer: Yes. Search and result browsing remain available. Rejecting analytics only stops optional GA4 or GTM usage measurement events for page interactions and search activity.
      - question: How do I change cookie preferences later?
        answer: Use the **Cookie Preferences** control in the site footer or open [Cookie Preferences]() from the legal page.
      - question: Why do result counts vary by source?
        answer: API coverage, indexing frequency, metadata completeness, and availability differ across providers. OpenAlex and Crossref emphasize broad scholarly metadata, and publication typing may vary by source. Combining both sources usually yields broader and more resilient discovery coverage than relying on one source alone.
      - question: Is this legal advice or a professional recommendation?
        answer: No. Knowledge Space is an informational research-discovery tool only, not legal advice or a professional recommendation. For jurisdiction-specific legal or compliance decisions, consult qualified counsel in the relevant jurisdiction. Mandatory local consumer and data protection rights remain fully unaffected.
