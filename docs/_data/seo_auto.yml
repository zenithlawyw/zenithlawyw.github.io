    questions:
      - question: What are the main limitations of current XAI methods identified in the literature?
        answer: "The literature identifies five interconnected limitations: explanation ambiguity across methods, systematic inaccuracy in explanation methods, a gap between research and deployment practice, structural limits on black-box auditability, and a metrics crisis where evaluation tools fail to distinguish meaningful differences between methods. These limitations are not merely technical but also conceptual and organisational."
      - question: Why do Ghassemi et al. argue that explainability requirements may harm clinical AI?
        answer: Ghassemi et al. argue that mandating explainability for clinical AI could divert resources from rigorous validation through prospective trials and deployment monitoring. They contend that a thoroughly validated model whose outputs clinicians understand through training may be safer than an explainable model whose behaviour has been less rigorously tested. This argument challenges the assumption that explainability is always a net benefit.
      - question: What is the deployment gap that Bhatt et al. identify in XAI practice?
        answer: Bhatt et al. interviewed practitioners across organisations that do deploy explainability and found that the majority of deployments primarily serve internal ML engineers debugging models, rather than affected stakeholders. Their conclusion lists specific limitations of current explanations for end-user use, including the need for domain experts to evaluate them, the risk of spurious correlations, and the latency of computing explanations in real time. This gap between research narratives and deployment practice limits the practical impact of XAI.
      - question: How does Casper et al. characterise the limits of black-box audits?
        answer: Casper et al. demonstrate that black-box access alone is insufficient for reliable auditing because adversarial inputs can be designed to produce misleading explanations, model editing can change behaviour without detection from explanation outputs, and the inherent ambiguity of post-hoc explanations means that multiple contradictory narratives can be supported by the same audit data.
      - question: What does Pawlicki et al. identify as the metrics crisis in XAI evaluation?
        answer: 'Pawlicki et al. identify three problems: metric duplication where multiple metrics measure the same underlying property and create false diversity, metric inefficacy where some metrics fail to distinguish between random and meaningful explanations, and metric confusion where contradictory results across metrics make it impossible to determine which method is better for a given task. <details markdown="1" class="appendix-callout group"> <summary>Appendix: Source Material</summary>'
