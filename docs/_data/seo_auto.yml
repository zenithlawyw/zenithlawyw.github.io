    questions:
      - question: What distinguishes interpretability from explainability in machine learning?
        answer: Interpretability refers to the ability to explain or to present in understandable terms to a human, a property of the model itself. Explainability refers to the broader field encompassing both inherently interpretable models and post-hoc methods that generate explanations after training. The distinction matters because interpretability is a design choice while explainability is a broader research programme.
      - question: What are the main dimensions of interpretability taxonomies in the literature?
        answer: "The literature converges on several recurring dimensions: intrinsic versus post-hoc methods, model-specific versus model-agnostic approaches, and local versus global explanations. These dimensions are not orthogonal and methods can combine aspects of multiple categories. The field has not yet settled on a single standardised taxonomy but the building blocks are widely agreed."
      - question: How does Doshi-Velez and Kim's three-tier framework structure XAI evaluation?
        answer: The framework distinguishes application-grounded evaluation (real task, real users), human-grounded evaluation (simplified task, lay users), and functionally-grounded evaluation (no humans, formal proxy for interpretability). Each tier trades off cost against ecological validity. Application-grounded provides the strongest evidence but is expensive; functionally-grounded is scalable but requires validation that the proxy actually measures interpretability.
      - question: What conceptual challenges does Watson identify for post-hoc explanations?
        answer: "Watson identifies three challenges: ambiguity of target (methods do not distinguish whether they are explaining the model, the data-generating process, or the domain phenomenon), disregard for error rates (standard methods report no confidence intervals and perform no severe testing), and product over process (emphasising the final explanation product rather than explanation as an ongoing, interactive exchange between agents). These challenges apply specifically to post-hoc methods and question whether such explanations can satisfy scientific standards of evidence."
      - question: What role do taxonomies play in structuring XAI research and practice?
        answer: 'Taxonomies serve three functions: they create shared vocabulary for cross-study comparison, they identify gaps where no methods exist for important categories, and they help practitioners select appropriate methods for their specific task. Chazette et al. demonstrate this through a knowledge catalogue that organises the factors shaping explainability requirements and connects them to usage context and explanation goals. <details markdown="1" class="appendix-callout group"> <summary>Appendix: Source Material</summary>'
