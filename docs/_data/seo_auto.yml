    questions:
      - question: What each paper assumes about the problem?
        answer: "| Method | Problem framed as | Solution approach | Causal claim | | ----------- | ------------------------------------------------- | ------------------------------ | ------------------------------ | | Causal SHAP | Need for causal graph → automation | PC algorithm + IDA | Yes: interventional |"
      - question: When correlation awareness is enough?
        answer: "ExCIR raises an important question that the field has not settled: for which decisions do we need causal attributions, and when is correlation awareness sufficient? The answer depends on the stakes and reversibility of the decision. A low-stakes, high-volume decision (e.g., product recommendation) can tolerate correlation-aware explanations because the cost of a misattribution is low. A high-stakes decision (e.g., medical diagnosis, loan denial) demands causal attribution because regulatory and ethical accountability requires answering counterfactual questions about what would have happened if a feature had been different."
      - question: Can ExCIR be extended to instance-level attribution?
        answer: "The paper focuses on global attribution: a single score per feature for the entire dataset. Instance-level attribution would require recomputing the co-movement measure per-instance, which would eliminate the computational advantage over SHAP."
      - question: Does the PC algorithm of Causal SHAP fail with many features?
        answer: PC runs conditional-independence tests whose cost grows quickly with the number of features, so in dense, high-dimensional settings the discovery step becomes expensive. The authors identify greedy equivalence search (GES) as the follow-up for scaling and the FCI algorithm for cases with hidden variables.
      - question: Does C3A require a labelled support set at explanation time?
        answer: The contrastive metric compares query descriptors against labelled support set descriptors for each candidate class. This is standard in FSL evaluation and is available whenever the model is deployed for FSL classification.
      - question: How should a practitioner choose between Causal SHAP and ExCIR?
        answer: If causation is provably required (regulatory, medical, high-stakes), invest in Causal SHAP despite its assumptions and scalability limits. If correlation awareness is sufficient and computational efficiency matters, ExCIR offers a practical alternative. The threshold between "causation required" and "correlation sufficient" is a domain-specific policy judgement, not a technical one.
      - question: Does contrastive attribution generalise beyond few-shot learning?
        answer: The contrastive principle, attributing by comparing what the model sees in the target class versus competing classes, is general. Future work could apply it to standard classification by using class-conditional feature statistics as the contrast reference, though this has not been systematically tested.
