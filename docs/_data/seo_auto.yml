    questions:
      - question: What are the main categories of open challenges in the XAI 2.0 manifesto?
        answer: "Longo et al. (2024) organise 28 open problems into nine categories: creating explanations for new types of AI, improving current XAI methods, clarifying the use of concepts, evaluating XAI methods and explanations, supporting the human-centredness of explanations, supporting the multi-dimensionality of explainability, adjusting XAI methods and explanations, mitigating the negative impact of XAI, and improving the societal impact of XAI. The categories move from technical and conceptual problems towards evaluation, human-centred and societal problems."
      - question: What distinguishes human-centred challenges from technical challenges in XAI?
        answer: Technical challenges focus on formal properties of explanations such as completeness, robustness, and reproducibility of attribution methods. Human-centred challenges address how explanations interact with human cognition including how much detail users can process, how explanations affect trust, and whether explanations personalise to different user expertise levels. Solving technical challenges does not automatically resolve human-centred ones.
      - question: Why does the XAI 2.0 manifesto call for interdisciplinary infrastructure?
        answer: The manifesto argues that no single discipline can address all 28 problems because explanation is simultaneously a mathematical, psychological, and sociological phenomenon. Interdisciplinary infrastructure means shared experimental platforms, standardised evaluation protocols that work across disciplines, funding mechanisms that reward collaboration, and publication venues that accept hybrid contributions spanning computer science, cognitive science, and law.
      - question: How can evaluation become a first-class problem in XAI research?
        answer: The manifesto argues that evaluation should shift from a post-hoc activity to a design-stage requirement. This means developing community-standard benchmarks, establishing ground-truth datasets for explanation correctness, creating reproducible evaluation protocols that span research groups, and making evaluation quality a publication criterion equivalent to methodological novelty. Currently, evaluation quality varies widely and is rarely treated as a primary contribution.
      - question: What regulatory challenges does the XAI 2.0 manifesto identify?
        answer: 'The regulatory dimension runs through several of the nine categories rather than forming a single cluster. The right to be forgotten (problem 27) questions how explainable and auditable systems can also honour data erasure. The evaluation framework (problem 11) is what would make explanations auditable at scale. The power imbalance between individuals and companies (problem 28) raises human rights and participative design arguments that connect XAI to regulation. These problems are urgent because regulatory timelines are shortening while technical standards remain fluid. <details markdown="1" class="appendix-callout group"> <summary>Appendix: Source Material</summary>'
