    questions:
      - question: Can FACE be extended to transformers?
        answer: Not directly. Transformers use attention mechanisms and layer normalisation, which do not produce piecewise-linear regions in the same way as ReLU-activated feedforward networks. A transformer-specific exact method would require a different mathematical approach.
      - question: How does the Pareto front of MOFAE help a practitioner?
        answer: It forces explicit trade-off decisions. A healthcare deployment might prioritise faithfulness (the explanation must accurately reflect the model) over complexity (the explanation can be long). A consumer-facing product might invert those priorities. MOFAE generates both options and lets the domain expert choose, rather than hiding the trade-off inside a single score.
      - question: Is the reward function of GAPS architecture-dependent?
        answer: The reward function operates on model predictions, which are available for any architecture. The restriction of the paper to Random Forest is a choice about experimental scope, not a limitation of the method.
      - question: Does higher-order attribution always improve explanation quality?
        answer: "Not necessarily. Higher-order terms increase interpretability cost: a stakeholder who struggles to understand first-order attributions will be overwhelmed by second-order interaction maps. The value of higher-order attribution depends on whether feature interactions are materially important for the decision. This question can be answered empirically before deploying the explanation method."
      - question: Which of these methods is closest to production-ready?
        answer: FACE is the most mature for its target architecture (FNNs) and offers a clear advantage over approximations. MOFAE and higher-order IG require further scalability work. GAPS needs broader validation across model types and domains.
