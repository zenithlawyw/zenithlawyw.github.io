    questions:
      - question: Can WAE and RExQUAL be used together?
        answer: Yes, they measure different things. WAE evaluates against data properties; RExQUAL evaluates against discovered rules. A method that scores well on both provides convergent evidence of quality.
      - question: Does the finding of Moreira et al. about model type generalise beyond counterfactuals?
        answer: It has not been tested for attribution methods. The finding that different architectures learn similar patterns on well-represented data is plausible for attribution as well, but the counterfactual-specific nature of the benchmark means direct extrapolation is speculative.
      - question: Is there a standardised benchmark suite for attribution evaluation?
        answer: "No. The papers reviewed here suggest why: domain, architecture, and task interact too strongly for a single benchmark to be universally informative. The field is moving toward task-specific evaluation suites rather than a single leaderboard."
      - question: How should a practitioner choose between evaluation metrics?
        answer: "Start by asking: what kind of failure matters most? If false positive attributions (highlighting irrelevant features) are the main risk, use precision-oriented metrics. If false negatives (missing important features) are worse, use recall-oriented metrics or human evaluation. No single metric captures both."
      - question: Does human evaluation correlate with automated metrics?
        answer: "Dehdarirad's study couples automated faithfulness metrics with a 100-rater human relevance evaluation. The human results show that context matters: STI-based transformer models achieve higher relevance ratings when features are judged within full text, indicating that model-identified features align more closely with human judgement when context is preserved. Automated metrics remain cheaper and more reproducible; human evaluation adds the human-relevance dimension that faithfulness scores alone do not capture."
