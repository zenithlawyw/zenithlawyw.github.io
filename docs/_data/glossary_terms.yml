- term: Circular Wait
  definition:
    Circular wait is a deadlock condition where each process waits for a
    resource currently held by the next process in a cycle.
  source:
    label: Deadlock (computer science)
    url: https://en.wikipedia.org/wiki/Deadlock_(computer_science)
    tier: Tier 3 (reference encyclopaedia)
  related_posts:
