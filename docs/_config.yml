baseurl: "" # the subpath of your site, e.g. /blog
url: "https://zenithlaw.com" # production hostname for absolute links, canonical tags, and print URLs
favicon: "/favicon.ico" # the favicon for your site
title: Zenith Law
email: hello@zenithlaw.com
author: Zenith Law
twitter_username: zenithlawyw
github_username: zenithlawyw
copyright: "Copyright (c) {currentYear} {author}"
description: >-
  Zenith Law is a strategist, engineer, researcher, and 
  trainer with 25+ years of hands-on polyglot engineering
  experience and 12+ years in senior technical leadership.
  He builds mission-critical, scalable, and observable data 
  and application platforms, with a strong focus on 
  cybersecurity, governance, digital sovereignty, and 
  resilient cloud delivery in regulated domains. His 
  perspective is further shaped by legal training and 
  doctoral research in data science, including metadata, 
  lineage, data quality, and AI/ML-ready platform abstractions.

site_verification:
  bing: "75D8018FB88654D7037F72D05D25E925"

google_analytics: G-P49RPF7579
gtm_container_id: ""
enableDNT: "false"
consent_management:
  enabled: true
  version: "2026-04-23"
  storage_key: "zyw_cookie_consent_v1"
  functional_default: false
  analytics_default: false
  privacy_policy_url: "/legal/privacy-cookies-data-protection/"
  analytics_platforms:
    matomo:
      enabled: false
      url: ""
      site_id: ""
    umami:
      enabled: false
      script_url: ""
      website_id: ""
    plausible:
      enabled: false
      script_url: "https://plausible.io/js/script.js"
      domain: "zenithlaw.com"
  events:
    track_page_view: true
    track_link_clicks: true
    track_scroll_depth: true
    track_form_submits: true

hero:
  height: "100vh"

zyw:
  article_snapshot: false
  date_format: "%-d %B %Y"

collections:
  authors:
    output: true

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"

theme: zyw-theme
sitemap: true
lang: "en"

landing:
  article_preview:
    enabled: true
    heading: "Latest Engineering and Governance Articles"
    description: "See recent incident-informed analysis, practical implementation guidance, and policy-aware architecture lessons."
    count: 3
    cta_label: "Browse all articles"
    cta_url: "/articles/"
  testimonials:
    enabled: false
    heading: "Testimonials"
    description: "Feedback themes from advisory and engineering collaboration across regulated and high-reliability workloads."
    items:
      - quote: "Clear technical direction, with governance controls that were actionable from day one."
        name: "Platform Engineering Lead"
        role: "Financial Services"
      - quote: "Security, resilience, and delivery speed improved together instead of pulling in opposite directions."
        name: "Head of Technology Risk"
        role: "Enterprise Operations"
      - quote: "Architecture recommendations translated directly into implementation plans that teams could execute."
        name: "Principal Data Architect"
        role: "Data and AI Platforms"
  experience:
    enabled: true
    heading: "Experience and Expertise"
    description: "Experience spans cloud-native platforms, data-intensive systems, and governance-critical modernization contexts."
    items:
      - name: "Cloud and Platform Teams"
      - name: "Data and AI Programs"
      - name: "Security and Risk Offices"
      - name: "Engineering Leadership"
      - name: "Regulated Industry Workloads"
      - name: "Cross-Border Delivery"
  cta:
    enabled: true
    heading: "Move From Reactive Fixes to Resilient System Design"
    description: "Use the article hub to identify reusable patterns for reliability, traceability, and governance-by-design."
    primary_label: "Open the Article Hub"
    primary_url: "/articles/"
    secondary_label: "Read Legal Notices"
    secondary_url: "/legal/"

references:
  style: harvard
  compact_breakpoint: 900
  mobile_url_label_min: 18
  mobile_url_label_max: 52
  build_url_label_max: 0

post_menu:
  sticky_gap: 12

footer:
  legal_links:
    - label: Legal
      url: /legal/
    - label: Privacy & Cookies
      url: /legal/privacy-cookies-data-protection/
    - label: Terms of Use
      url: /legal/terms-of-use/
    - label: Disclaimer
      url: /legal/disclaimer/
  legal_links_separator: " | "

legal_compliance_notice:
  enabled: true
  title: "Legal and Compliance Notice"
  body: "This content is provided for educational and informational purposes only. It is not legal, regulated professional, tax, audit, investment, or other jurisdiction-specific advice."
  links_intro: "For full details on scope boundaries, privacy and data protection practices, applicable jurisdictions, and legal terms, please refer to our"
  links:
    - label: "Legal Notices"
      url: /legal/
    - label: "Privacy, Cookies and Data Protection"
      url: /legal/privacy-cookies-data-protection/
    - label: "Disclaimer"
      url: /legal/disclaimer/

markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
kramdown:
  input: GFM
  syntax_highlighter: rouge

translate_langs:
  - lang: en
    text: English
  - lang: zh-TW
    text: 繁體中文
  - lang: zh-CN
    text: 简体中文
  - lang: ja
    text: 日本語
  - lang: ko
    text: 한국인
  - lang: de
    text: Deutsch
  - lang: fr
    text: Français
  - lang: it
    text: Italiano
  - lang: es
    text: Español

translate_reserved_words:
  - 2026 Zenith Law
  - AI
  - Agile
  - Apache Spark
  - Azure
  - CI/CD
  - ChatGPT
  - DataOps
  - DevOps
  - GPT
  - Google Translate
  - Kubernetes
  - LLM
  - MLOps
  - Spark
  - Terraform
  - Zenith
  - Zenith Law

nav_pages:
  - articles.md
  - literature.md
  - glossary.md
  - faq.md

glossary:
  moderation:
    enabled: true
    show_unapproved: false
    show_notice: false
  auto_approve:
    enabled: true
    min_confidence: 7
    require_related_post: true
    terms:
      - Support Vector Machine
      - Support Vector Machines
      - MCP
      - A2A
      - MCP A2A
      - LangGraph
      - LangChain
      - Agent Card
    patterns:
      - '^mcp\b'
      - '^a2a\b'
      - "^support vector machine(s)?$"

literature:
  default_profile: data-provenance
  profiles:
    data-provenance:
      label: Data Science and Provenance
      keywords:
        - data science
        - provenance
        - traceability
      lookbackDays: 365
    llm-governance:
      label: LLM Governance and Safety
      keywords:
        - large language model
        - governance
        - safety
      lookbackDays: 365
    supply-chain-security:
      label: Software Supply Chain Security
      keywords:
        - software supply chain
        - provenance
        - integrity
      lookbackDays: 730
    custom:
      label: Custom
      keywords: []
      lookbackDays: 365

