name: Deploy Jekyll with GitHub Pages dependencies preinstalled
on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true # runs `bundle install` automatically
          working-directory: ./docs # Gemfile is here

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies for docs validation
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Generate SEO auto data
        working-directory: ./docs
        run: ruby scripts/generate_seo_auto.rb

      - name: Generate glossary auto data
        working-directory: ./docs
        run: ruby scripts/generate_glossary_auto.rb

      - name: Validate SEO auto data
        working-directory: ./docs
        run: |
          set -euo pipefail
          test -f _data/seo_auto.yml || { echo "ERROR: _data/seo_auto.yml is missing"; exit 1; }
          test -s _data/seo_auto.yml || { echo "ERROR: _data/seo_auto.yml is empty"; exit 1; }
          grep -q '^keywords:' _data/seo_auto.yml || { echo "ERROR: keywords section missing in _data/seo_auto.yml"; exit 1; }
          grep -q '^search_words:' _data/seo_auto.yml || { echo "ERROR: search_words section missing in _data/seo_auto.yml"; exit 1; }
          grep -q '^posts:' _data/seo_auto.yml || { echo "ERROR: posts section missing in _data/seo_auto.yml"; exit 1; }
          grep -q '^pages:' _data/seo_auto.yml || { echo "ERROR: pages section missing in _data/seo_auto.yml"; exit 1; }
          grep -q '^global_questions:' _data/seo_auto.yml || { echo "ERROR: global_questions section missing in _data/seo_auto.yml"; exit 1; }
          grep -q '^- ' _data/seo_auto.yml || { echo "ERROR: _data/seo_auto.yml contains no generated list items"; exit 1; }
          echo "SEO auto data validation passed"

      - name: Validate glossary auto data
        working-directory: ./docs
        run: |
          set -euo pipefail
          test -f _data/glossary_auto.yml || { echo "ERROR: _data/glossary_auto.yml is missing"; exit 1; }
          test -s _data/glossary_auto.yml || { echo "ERROR: _data/glossary_auto.yml is empty"; exit 1; }
          grep -q '^total_candidates:' _data/glossary_auto.yml || { echo "ERROR: total_candidates missing in _data/glossary_auto.yml"; exit 1; }
          grep -q '^candidates:' _data/glossary_auto.yml || { echo "ERROR: candidates section missing in _data/glossary_auto.yml"; exit 1; }
          echo "Glossary auto data validation passed"

      - name: Build publish pipeline (Makefile)
        run: make -C docs publish

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-search-engines:
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install notifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-auth

      - name: Notify Google and Bing about sitemap and updated URLs
        env:
          SITE_URL: https://zenithlaw.com
          SITEMAP_URL: https://zenithlaw.com/sitemap.xml
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
          INDEXNOW_MAX_URLS: "10000"
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SITE_URL: https://zenithlaw.com/
        run: python docs/scripts/notify_search_engines.py
